# Environment for the analysis scripts: micromamba create -f vg-local.yml
name: vg-local
channels:
  - conda-forge
  - bioconda
dependencies:
  # R (phylolm, corHMM, geiger, castor: install_cran.R)
  - compilers
  - make
  - r-rcpp
  - r-rcpparmadillo
  - r-nloptr
  - r-gensa
  - r-expm
  - r-desolve
  - r-mvtnorm
  - r-coda
  - r-future.apply
  - r-igraph
  - r-viridis
  - r-rcppeigen
  - r-rmpfr
  - r-gmp
  - r-base=4.4
  - r-ape
  - r-phytools
  - r-phangorn
  - r-mcmcglmm
  # R: data and plots
  - r-tidyverse
  - r-patchwork
  - r-svglite
  - r-ggrepel
  - r-ggnewscale
  - r-optparse
  - bioconductor-treeio
  - bioconductor-ggtree
  - bioconductor-ggtreeextra
  - r-irkernel
  # Python
  - python=3.12
  - pandas
  - numpy
  - scipy
  - matplotlib
  - seaborn
  - biopython
  - dendropy
  - toytree
  - jupyterlab
  - pip
  - pip:
      - cnsplots==0.8.0
      - pypdf
      - svgutils==0.3.4
